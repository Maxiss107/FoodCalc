name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Ruff, Migrations & Pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodcalc_test
          POSTGRES_USER: foodcalc_user
          POSTGRES_PASSWORD: foodcalc_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: "core.settings"
      DEBUG: "True"
      SECRET_KEY: "ci-test-foodcalc-secret-key-32chr"
      POSTGRES_DB: "foodcalc_test"
      POSTGRES_USER: "foodcalc_user"
      POSTGRES_PASSWORD: "foodcalc_pass"
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Check code formatting
        run: ruff format --check .

      - name: Check for missing Django migrations
        run: python manage.py makemigrations --check --dry-run --no-input

      - name: Run pytest test suite
        run: python -m pytest --no-header -v